---
githubConfigUrl: "https://github.com/voxpupuli"

runnerGroup: "voxarc"

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807  # 2.338.0
        command: ["/home/runner/run.sh"]
        # to be discussed
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "16"
            memory: "32Gi"
        volumeMounts:
          - name: hostedtoolcache
            mountPath: /opt/hostedtoolcache
          - name: work
            mountPath: /home/runner/_work
    volumes:
      - name: work
        emptyDir: {}
      - name: hostedtoolcache
        emptyDir: {}
