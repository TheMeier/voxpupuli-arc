---
githubConfigUrl: "https://github.com/voxpupuli"

runnerGroup: "voxarc"
containerMode:
  type: "kubernetes-novolume"
  kubernetesModeAdditionalRoleRules: []

template:
  spec:
    securityContext:
      fsGroup: 123
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner@sha256:4ffadc0002b2581327e06101fc8c06cd189232baf79fe561fac9caeb76f5e807  # 2.338.0
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOKS
            value: /home/runner/k8s-novolume/index.js
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /home/runner/pod-template.yaml
          - name: ACTIONS_RUNNER_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "true"
        # to be discussed
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "16"
            memory: "32Gi"
        volumeMounts:
          - name: hostedtoolcache
            mountPath: /opt/hostedtoolcache
          - name: work
            mountPath: /home/runner/_work
          - name: pod-template
            mountPath: /home/runner/pod-template.yaml
            subPath: pod-template.yaml
    volumes:
      - name: work
        emptyDir: {}
      - name: hostedtoolcache
        emptyDir: {}
      - name: pod-template
        configMap:
          name: runnerset-voxpupuli-k8s-pod-template
